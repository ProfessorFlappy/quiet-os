---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: quiet-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://repo.librewolf.net/librewolf.repo
      copr:
        - sunwire/envycontrol
        - faugus/faugus-launcher
    install:
      packages:
        - librewolf
        - python3-envycontrol
        - faugus-launcher
        - syncthing # Remember to enable the service
        - lm_sensors
        - fish
        - steam
        - gamemode
        - mangohud
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
        - gnome-software
        - gnome-system-monitor
        - gnome-tour
        - yelp
        - malcontent-control
        - nvtop
        - htop
        
  - type: rpm-ostree
    repos:
      - netbird.repo
    install:
      - netbird # Remember to run 'sudo netbird service install' then enable the service

  - type: script
    scripts:
      - build-msi-ec.sh
    
  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.gnome.Extensions
          - org.gnome.SimpleScan
          - org.gnome.Calculator
          - org.gnome.gitlab.somas.Apostrophe
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.Decibels
          - io.github.shonebinu.Brief
          - io.missioncenter.MissionCenter
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - org.pvermeer.WebAppHub
          - org.cockpit_project.CockpitClient
          - io.github.totoshko88.RustConn
          - com.discordapp.Discord
          - org.gnome.Boxes
          - org.bunkus.mkvtoolnix-gui
          - it.mijorus.gearlever
          - com.vysp3r.ProtonPlus
          - com.github.mtkennerly.ludusavi
          - org.vinegarhq.Sober
          - org.prismlauncher.PrismLauncher
          - org.jellyfin.JellyfinDesktop
          
  - type: gnome-extensions
    install:
      - AppIndicator and KStatusNotifierItem Support
    uninstall:
      - Background Logo
  
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
